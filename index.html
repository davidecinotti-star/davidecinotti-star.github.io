<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>EPSO AD7 Audit — caricamento v4.9.0</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color-scheme:light dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f172a;color:#e2e8f0}
main{width:min(520px,calc(100% - 32px));padding:28px;border:1px solid #334155;border-radius:16px;background:#111827;box-shadow:0 20px 60px #0006}
h1{font-size:1.25rem;margin:0 0 12px}p{line-height:1.55;margin:8px 0}.bar{height:8px;background:#334155;border-radius:99px;overflow:hidden;margin-top:18px}.fill{height:100%;width:12%;background:#38bdf8;animation:p 1.1s ease-in-out infinite alternate}@keyframes p{to{width:92%}}#err{color:#fecaca;white-space:pre-wrap}
</style>
</head>
<body><main><h1>Caricamento del corso v4.9.0</h1><p>Ricostruzione verificata del corso in corso.</p><div class="bar"><div class="fill"></div></div><p id="err" role="alert"></p></main>
<script>
(async()=>{
 const expectedOld='0895ffa33c229ec30f1c6f289f8d3e7077b9b8721a6127a0822bac95ce5d926d';
 const expectedNew='432e195f227833042235e8d2e87b02b9fef005ddf3f78bb8fa2491bae56f2e9d';
 const chunkCount=9;
 const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
 const fail=m=>{throw new Error(m)};
 try{
  if(!('DecompressionStream' in window)) fail('Il browser non supporta DecompressionStream. Usa una versione aggiornata di Chrome, Edge, Firefox o Safari.');
  const oldResp=await fetch('base-v471.html',{cache:'no-store'}); if(!oldResp.ok) fail('Base del corso non disponibile.');
  const oldBytes=new Uint8Array(await oldResp.arrayBuffer());
  if(hex(await crypto.subtle.digest('SHA-256',oldBytes))!==expectedOld) fail('Checksum della base non valido.');
  const texts=await Promise.all(Array.from({length:chunkCount},(_,i)=>fetch('patch/p'+String(i).padStart(3,'0')+'.txt',{cache:'no-store'}).then(r=>r.ok?r.text():fail('Patch incompleta.'))));
  const b64=texts.join('').replace(/\s/g,'');
  const raw=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  const patch=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
  let pos=0; const take=n=>{const s=patch.slice(pos,pos+n);pos+=n;return s};
  const txt=new TextDecoder(); if(txt.decode(take(4))!=='D490') fail('Formato patch non valido.');
  const oldHash=hex(take(32)), newHash=hex(take(32)); if(oldHash!==expectedOld||newHash!==expectedNew) fail('Metadati patch non validi.');
  const view=new DataView(patch.buffer,patch.byteOffset,patch.byteLength);
  const u32=()=>{const v=view.getUint32(pos);pos+=4;return v};
  const u64=()=>{const v=Number(view.getBigUint64(pos));pos+=8;return v};
  const newLen=u64(), opCount=u32(), parts=[]; let built=0;
  for(let i=0;i<opCount;i++){
   const type=patch[pos++];
   if(type===0){const off=u64(),len=u64(); if(off+len>oldBytes.length) fail('Copia fuori intervallo.'); parts.push(oldBytes.slice(off,off+len));built+=len;}
   else if(type===1){const len=u32();parts.push(take(len));built+=len;}
   else fail('Operazione patch non valida.');
  }
  if(built!==newLen||pos!==patch.length) fail('Lunghezza ricostruita non valida.');
  const out=new Uint8Array(newLen);let at=0;for(const p of parts){out.set(p,at);at+=p.length;}
  if(hex(await crypto.subtle.digest('SHA-256',out))!==expectedNew) fail('Checksum finale della v4.9.0 non valido.');
  const html=new TextDecoder().decode(out);document.open();document.write(html);document.close();
 }catch(e){document.getElementById('err').textContent='Errore di caricamento: '+e.message;console.error(e);}
})();
</script></body></html>
